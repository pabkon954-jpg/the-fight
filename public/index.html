<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스무스무 - AI 멀티플레이 스무고개</title>
    <link rel="stylesheet" href="style.css">
    <!-- Socket.io CDN 라이브러리 불러오기 -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
    <div id="game-container">
        <header>
            <h1>스무스무 🎲</h1>
            <p class="subtitle">AI와 함께하는 실시간 멀티플레이 스무고개</p>
        </header>

        <!-- 대기실 / 방 생성 & 입장 영역 -->
        <div id="lobby-screen" class="screen">
            <div class="input-group">
                <input type="text" id="player-name" placeholder="닉네임을 입력하세요" maxlength="10">
            </div>
            
            <div class="button-group">
                <button id="create-room-btn" class="btn primary">방 만들기</button>
            </div>

            <div class="divider"><span>또는</span></div>

            <div class="input-group row">
                <input type="text" id="room-code-input" placeholder="방 코드 4자리" maxlength="4">
                <button id="join-room-btn" class="btn secondary">참여하기</button>
            </div>
        </div>

        <!-- 게임 진행 화면 -->
        <div id="game-screen" class="screen hidden">
            <div class="room-info">
                <span>방 코드: <strong id="display-room-code">-</strong></span>
                <span id="player-count">참여자: 1명</span>
            </div>

            <div id="chat-box" class="chat-box">
                <!-- 질문 및 AI 응답 메시지가 출력되는 영역 -->
            </div>

            <div class="game-controls">
                <div class="question-status">
                    <span>남은 질문: <strong id="questions-left">20</strong>/20</span>
                </div>
                <div class="input-group row">
                    <input type="text" id="question-input" placeholder="질문이나 정답을 입력하세요..." disabled>
                    <button id="send-btn" class="btn primary" disabled>전송</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js?v=final2"></script>
</body>
</html>
