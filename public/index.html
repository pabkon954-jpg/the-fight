<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 협동 스무고개</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>AI 협동 스무고개</h1>

    <!-- 1. 대기실 화면 (로비) -->
    <div id="lobby-screen">
      <div class="input-group">
        <input type="text" id="username-input" placeholder="닉네임 입력">
      </div>
      <div class="button-group">
        <button id="create-room-btn">방 만들기</button>
      </div>
      <hr style="margin: 20px 0; border: 0.5px solid #444;">
      <div class="input-group">
        <input type="text" id="room-id-input" placeholder="방 코드 4자리 입력">
        <button id="join-room-btn">방 참가하기</button>
      </div>
    </div>

    <!-- 2. 게임 진행 화면 -->
    <div id="game-screen" style="display: none;">
      <div class="game-header">
        <h2>방 번호: <span id="display-room-id">-</span></h2>
        <div>질문 횟수: <span id="question-count">0 / 20</span></div>
      </div>

      <div class="player-section">
        <h3>참여 중인 플레이어</h3>
        <ul id="player-list"></ul>
      </div>

      <div class="chat-section">
        <h3>질문 및 답변 기록</h3>
        <div id="chat-history" style="height: 250px; overflow-y: auto; border: 1px solid #444; padding: 10px; margin-bottom: 10px;"></div>
      </div>

      <div class="input-section">
        <input type="text" id="question-input" placeholder="질문 또는 정답을 입력하세요...">
        <button id="send-question-btn">전송</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js?v=4.0"></script>
</body>
</html>
