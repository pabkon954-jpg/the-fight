<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 협동 스무고개</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>AI 협동 스무고개</h1>

    <!-- 1. 로비 화면 -->
    <div id="lobby-screen">
      <div class="input-group">
        <input type="text" id="username-input" placeholder="닉네임 입력">
      </div>
      
      <div class="input-group" style="margin-top: 10px;">
        <label for="difficulty-select" style="align-self: center; font-size: 0.9rem; color: #aaa;">난이도:</label>
        <select id="difficulty-select" style="flex: 1; padding: 10px; border-radius: 6px; background: #2a2a2a; color: #fff; border: 1px solid #444;">
          <option value="easy">쉬움 (친절한 힌트)</option>
          <option value="normal" selected>보통 (일반적인 단어)</option>
          <option value="hard">어려움 (단답형 AI)</option>
          <option value="extreme">극악무도 (은밀한 힌트)</option>
        </select>
      </div>

      <div class="button-group" style="margin-top: 10px;">
        <button id="create-room-btn">방 만들기</button>
      </div>
      <hr style="margin: 20px 0; border: 0.5px solid #444;">
      <div class="input-group">
        <input type="text" id="room-id-input" placeholder="방 코드 4자리 입력">
        <button id="join-room-btn">방 참가하기</button>
      </div>
    </div>

    <!-- 2. 게임 화면 -->
    <div id="game-screen" style="display: none;">
      <div class="game-header">
        <h2>방 번호: <span id="display-room-id">-</span></h2>
        <div>질문 횟수: <span id="question-count">0 / 20</span></div>
      </div>

      <div class="player-section">
        <h3>참여 중인 플레이어</h3>
        <ul id="player-list"></ul>
      </div>

      <div class="chat-section">
        <h3>질문 및 답변 기록</h3>
        <div id="chat-history" style="height: 250px; overflow-y: auto; border: 1px solid #444; padding: 10px; margin-bottom: 10px;"></div>
      </div>

      <div class="input-section">
        <input type="text" id="question-input" placeholder="질문 또는 정답을 입력하세요...">
        <button id="send-question-btn">전송</button>
      </div>

      <button id="restart-btn" style="display: none; width: 100%; margin-top: 10px; background-color: #ff9800;">새 라운드 시작하기 🔄</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js?v=final"></script>
</body>
</html>
