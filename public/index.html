<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스무스무 - AI 스무고개</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- 메인 로비 (방 생성 / 입장) -->
        <div id="lobby" class="card">
            <h1>스무스무 🎲</h1>
            <p class="subtitle">AI와 함께하는 멀티플레이 스무고개</p>

            <div class="input-group">
                <label for="username">닉네임</label>
                <input type="text" id="username" placeholder="닉네임을 입력하세요" maxlength="10">
            </div>

            <button id="create-room-btn" class="btn primary">방 만들기</button>

            <div class="divider">
                <span>또는 기존 방 입장</span>
            </div>

            <div class="join-group">
                <input type="text" id="room-code-input" placeholder="방 코드 4자리" maxlength="4">
                <button id="join-room-btn" class="btn secondary">입장</button>
            </div>
        </div>

        <!-- 게임 진행 화면 -->
        <div id="game-room" class="card hidden">
            <div class="room-header">
                <div class="room-info">
                    <span>방 코드: <strong id="room-code-display">-</strong></span>
                    <span>참여 인원: <strong id="player-count">0</strong>명</span>
                </div>
                <div class="question-counter">
                    남은 질문: <span id="questions-left">20</span>/20
                </div>
            </div>

            <div id="chat-window" class="chat-window">
                <div class="system-message">게임 방에 입장했습니다. 질문을 입력해보세요!</div>
            </div>

            <div class="input-area">
                <input type="text" id="question-input" placeholder="질문이나 정답을 입력하세요..." disabled>
                <button id="send-btn" class="btn primary" disabled>전송</button>
            </div>
        </div>
    </div>

    <!-- Socket.io 라이브러리를 CDN으로 안정적으로 로드 -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="script.js?v=final2"></script>
</body>
</html>
