<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스무스무 - AI 스무고개</title>
    <link rel="stylesheet" href="style.css">
    <!-- CDN Socket.io 로드 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
    <div id="game-container">
        <!-- 기존 UI 요소 그대로 유지 -->
        <div id="lobby-screen" class="screen">
            <h1>스무스무 🎲</h1>
            <input type="text" id="player-name" placeholder="닉네임 입력">
            <button id="create-room-btn">방 만들기</button>
            <div>
                <input type="text" id="room-code-input" placeholder="방 코드">
                <button id="join-room-btn">입장</button>
            </div>
        </div>

        <div id="game-screen" class="screen hidden">
            <div id="room-info"></div>
            <div id="chat-box"></div>
            <div id="input-area">
                <input type="text" id="question-input" placeholder="질문 또는 정답 입력">
                <button id="send-btn">전송</button>
            </div>
        </div>
    </div>

    <script src="script.js?v=final2"></script>
</body>
</html>
