<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스무스무 - AI 스무고개</title>
    <link rel="stylesheet" href="style.css?v=v6">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- 메인 로비 -->
        <div id="lobby" class="card">
            <h1>스무스무 🎲</h1>
            <p class="subtitle">AI와 함께하는 멀티플레이 스무고개</p>

            <div class="input-group">
                <label for="username">닉네임</label>
                <input type="text" id="username" placeholder="닉네임을 입력하세요" maxlength="10">
            </div>

            <div class="input-group">
                <label for="difficulty">난이도 선택 (방장만 대기실에서 변경 가능)</label>
                <select id="difficulty">
                    <option value="easy">쉬움 (힌트 제공)</option>
                    <option value="normal" selected>보통 (짧은 설명)</option>
                    <option value="hard">어려움 (단답형)</option>
                    <option value="extreme">극악 (알쏭달쏭)</option>
                </select>
            </div>

            <div class="input-group">
                <label>정답 카테고리 (복수 선택 가능, 아무것도 선택 안 하면 전체 랜덤)</label>
                <div class="category-toolbar">
                    <button type="button" class="link-btn" data-target="category-grid" data-action="all">전체 선택</button>
                    <button type="button" class="link-btn" data-target="category-grid" data-action="none">전체 해제</button>
                </div>
                <div id="category-grid" class="category-grid"></div>
            </div>

            <button id="create-room-btn" class="btn primary">방 만들기</button>

            <div class="divider">
                <span>또는 기존 방 입장</span>
            </div>

            <div class="join-group">
                <input type="text" id="room-code-input" placeholder="방 코드 4자리" maxlength="4">
                <button id="join-room-btn" class="btn secondary">입장</button>
            </div>
        </div>

        <!-- 게임 방 화면 -->
        <div id="game-room" class="card hidden">
            <div class="room-header">
                <div class="room-info">
                    <span>방 코드: <strong id="room-code-display">-</strong></span>
                    <span>참여 인원: <strong id="player-count">0</strong>명</span>
                </div>
                <div class="room-info" style="margin-top:2px;">
                    <span>난이도: <strong id="difficulty-display" style="color:#f59e0b;">보통</strong></span>
                </div>
                <div class="room-info" style="margin-top:2px;">
                    <span>카테고리: <strong id="category-display" style="color:#a78bfa;">랜덤(전체)</strong></span>
                </div>
                <div class="turn-info" style="margin-top:4px;">
                    현재 차례: <span id="current-turn-user" style="color:#3b82f6; font-weight:bold;">-</span>
                </div>
                <div class="question-counter" style="margin-top:2px;">
                    남은 질문: <span id="questions-left">20</span>/20
                </div>

                <div id="scoreboard" class="scoreboard"></div>
            </div>

            <!-- 대기실(설정) 패널 — 게임 시작 전에만 보임 -->
            <div id="pre-game-panel" class="pre-game-panel hidden">
                <div id="host-settings" class="hidden">
                    <p class="panel-title">⚙️ 방장 설정 — 시작하기 전에 자유롭게 바꿀 수 있어요</p>
                    <div class="input-group">
                        <label for="edit-difficulty">난이도</label>
                        <select id="edit-difficulty">
                            <option value="easy">쉬움 (힌트 제공)</option>
                            <option value="normal">보통 (짧은 설명)</option>
                            <option value="hard">어려움 (단답형)</option>
                            <option value="extreme">극악 (알쏭달쏭)</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>정답 카테고리 (복수 선택 가능, 아무것도 선택 안 하면 전체 랜덤)</label>
                        <div class="category-toolbar">
                            <button type="button" class="link-btn" data-target="edit-category-grid" data-action="all">전체 선택</button>
                            <button type="button" class="link-btn" data-target="edit-category-grid" data-action="none">전체 해제</button>
                        </div>
                        <div id="edit-category-grid" class="category-grid"></div>
                    </div>
                    <button id="start-game-btn" class="btn primary">🎮 게임 시작</button>
                </div>
                <div id="guest-waiting" class="hidden">
                    <p class="panel-title">⏳ 방장이 설정을 정하는 중입니다...</p>
                    <p class="waiting-detail">현재 설정 — 난이도: <strong id="waiting-difficulty">-</strong><br>카테고리: <strong id="waiting-category">-</strong></p>
                </div>
            </div>

            <!-- 실제 게임 플레이 패널 -->
            <div id="play-panel" class="hidden">
                <div id="hint-box" class="hint-box hidden"></div>

                <div id="chat-window" class="chat-window">
                    <div class="system-message">게임이 시작되었습니다. 질문이나 정답을 입력해보세요!</div>
                </div>

                <div class="input-area">
                    <input type="text" id="question-input" placeholder="질문이나 정답을 입력하세요...">
                    <button id="send-btn" class="btn primary">전송</button>
                </div>

                <div class="post-game-actions hidden" id="post-game-actions">
                    <button id="restart-btn" class="btn secondary">🔁 같은 설정으로 다시하기</button>
                    <button id="back-to-settings-btn" class="btn ghost hidden">⚙️ 설정 변경 후 재시작</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js?v=v6"></script>
</body>
</html>
